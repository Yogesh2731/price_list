databases:
  - name:         price-list-db
    databaseName: price_list
    user:         price_list_user
    plan:         free

services:
  - type:  web
    name:  sow-trial-app
    env:   node
    plan:  free
    region: frankfurt    # closest to Sweden (the client)

    # Render runs this to build the project
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend && npm install --prefix backend

    # Render runs this to start the server
    startCommand: node backend/server.js

    envVars:
      - key:   NODE_ENV
        value: production

      - key:   PORT
        value: 10000          # Render's default port for web services

      - key:   JWT_SECRET
        generateValue: true   # Render auto-generates a secure random secret

      - key:   JWT_EXPIRES_IN
        value: 24h

      - key:          DATABASE_URL
        fromDatabase:
          name:     price-list-db
          property: connectionString
