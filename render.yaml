  - name:         price-list-db
    databaseName: price_list
    user:         price_list_user
    plan:         free

services:
  - type:  web
    name:  sow-trial-app
    env:   node
    plan:  free

    # build.sh installs frontend deps, builds with Vite, then installs backend deps
    buildCommand: bash build.sh

    # Render runs this to start the server
    startCommand: node backend/server.js

    envVars:
      - key:   NODE_ENV
        value: production

      - key:   PORT
        value: 10000

      - key:   JWT_SECRET
        generateValue: true

      - key:   JWT_EXPIRES_IN
        value: 24h

      - key:          DATABASE_URL
        fromDatabase:
          name:     price-list-db
          property: connectionString
